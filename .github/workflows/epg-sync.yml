name: Sync EPG to GitHub Pages (Zero KV Writes)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate compact JSON EPG files
        run: python sync_epg.py

      - name: Commit & Push EPG JSONs to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add epg_data/
          if ! git diff --staged --quiet; then
            git commit -m "chore: update EPG JSON data"
            git push
          else
            echo "No EPG changes to commit."
          fi
